<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="gallery-container">
        <header class="gallery-header">
            <div class="title-box">
                <div class="logo">
                    <img height="50" width="50"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTc9oOSJHsy9WZvwfXncjgPvbMGHEfzhInMbxVuVsvxg&s=10">
                </div>

                <div>
                    <h1>Our <span>Gallery</span></h1>
                </div>
            </div>

            <div class="header-actions">
                <div class="search-box">
                    <input style="z-index: 99;" type="text" id="searchInput" placeholder="Search places..."
                        spellcheck="false">
                    <button class="search-img"><span class="detect">⌕</span></button>
                </div>
            </div>
        </header>

        <section class="gallery">

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <div class="card-content">
                    <h2></h2>
                </div>
            </article>

            <div class="buttons">
                <button class="pre-btn">Previous</button>
                <button class="more-btn">Next</button>
            </div>
        </section>
    </main>


    <div class="welcome-box" id="welcomeBox">
        <div class="welcome-art">
            <div class="glow-circle"></div>
            <span class="search-emoji">🔎</span>
            <span class="spark spark-one">✦</span>
            <span class="spark spark-two">✧</span>
            <span class="spark spark-three">✦</span>
        </div>

        <h1>Let's Find Something <span>Amazing!</span></h1>

        <p class="welcome-text">
            Your next favorite picture is just one search away.
        </p>

        <div class="search-message">
            <span class="typing-dot"></span>
            Please type something in the Above search box
        </div>

        <p class="welcome-bottom">
            ✨ Explore the world, 12 image at a time ✨
        </p>
    </div>


    <!-- Popup is now OUTSIDE .welcome-box, so it stays visible -->
    <div class="click-img">
        <img src="" alt="Preview">

        <div class="cancel">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none"
                stroke="url(#snipGradient)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                class="snip-icon">

                <defs>
                    <linearGradient id="snipGradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#6366f1" />
                        <stop offset="0.5" stop-color="#a855f7" />
                        <stop offset="1" stop-color="#ff4d9d" />
                    </linearGradient>
                </defs>

                <!-- Scissors -->
                <path class="scissors"
                    d="M4.56324 5.55783L7.4 7.99976M7.4 7.99976L11 10.9998M7.4 7.99976L4.50512 10.3863M7.4 7.99976L11 4.99976M2 4.49976C2 5.32818 2.67157 5.99976 3.5 5.99976C4.32843 5.99976 5 5.32818 5 4.49976C5 3.67133 4.32843 2.99976 3.5 2.99976C2.67157 2.99976 2 3.67133 2 4.49976ZM2 11.4998C2 12.3282 2.67157 12.9998 3.5 12.9998C4.32843 12.9998 5 12.3282 5 11.4998C5 10.6713 4.32843 9.99976 3.5 9.99976C2.67157 9.99976 2 10.6713 2 11.4998Z" />

                <!-- Dashed frame -->
                <path class="frame"
                    d="M8 15.0768V14M19.8462 7.27029C20.3409 7.41042 20.7309 7.62313 21.0537 7.94599C21.3766 8.26886 21.5893 8.65887 21.7294 9.1536M21.7294 18.8461C21.5893 19.3408 21.3766 19.7308 21.0537 20.0537C20.7309 20.3766 20.3409 20.5893 19.8462 20.7294M10.1538 20.7294C9.65913 20.5893 9.26913 20.3766 8.94627 20.0537C8.62341 19.7308 8.41071 19.3408 8.27058 18.8461M13.9231 21H16.0769M22 15.0768V12.9229M16.0769 7H13.9231" />
            </svg>
        </div>

        <div class="download">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none"
                stroke="url(#downloadGradient)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                class="download-icon">

                <defs>
                    <linearGradient id="downloadGradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#6366f1" />
                        <stop offset="0.5" stop-color="#a855f7" />
                        <stop offset="1" stop-color="#ff4d9d" />
                    </linearGradient>
                </defs>

                <!-- Arrow -->
                <path class="arrow"
                    d="M16.9504 12.1817C17.1981 12.814 16.5076 13.5726 15.1267 15.0899C13.6702 16.6902 12.9201 17.4904 12 17.5C11.0799 17.4904 10.3298 16.6902 8.87331 15.0899C7.49239 13.5726 6.80193 12.814 7.04964 12.1817C7.05868 12.1586 7.06851 12.1359 7.0791 12.1135C7.34928 11.542 8.24477 11.5029 10 11.5002V4.99998C10 4.53501 10 4.30253 10.0511 4.11179C10.1898 3.59414 10.5941 3.1898 11.1118 3.05111C11.3025 3 11.535 3 12 3C12.4649 3 12.6974 3 12.8882 3.05111C13.4058 3.1898 13.8102 3.59414 13.9489 4.11179C14 4.30253 14 4.53501 14 4.99998V11.5002C15.7552 11.5029 16.6507 11.542 16.9209 12.1135C16.9315 12.1359 16.9413 12.1586 16.9504 12.1817Z" />

                <!-- Base line -->
                <path class="base" d="M5.00006 21H19.0001" />
            </svg>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
